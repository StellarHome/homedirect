openapi: 3.0.3
info:
  title: HomeDirect API
  description: API for HomeDirect - A blockchain-powered rental marketplace for Nigeria and Africa
  version: 1.0.0
  contact:
    name: HomeDirect Team
    email: support@homedirect.ng
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3001/api/v1
    description: Local development server
  - url: https://api.homedirect.ng/api/v1
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Leases
    description: Lease management operations
  - name: Properties
    description: Property listing operations
  - name: Users
    description: User management operations
  - name: Payments
    description: Payment processing via Paystack
  - name: KYC
    description: KYC verification via Dojah
  - name: Webhooks
    description: Webhook handlers

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API is running
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  network:
                    type: string
                    example: testnet

  /leases:
    post:
      tags:
        - Leases
      summary: Create a new lease
      description: Create a new lease on the blockchain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - property_id
                - landlord_id
                - tenant_id
                - monthly_rent
                - security_deposit
                - duration_months
                - start_date
                - end_date
              properties:
                property_id:
                  type: string
                  description: Property ID
                landlord_id:
                  type: string
                  description: Landlord's Stellar public key
                tenant_id:
                  type: string
                  description: Tenant's Stellar public key
                monthly_rent:
                  type: integer
                  description: Monthly rent amount in stroops
                security_deposit:
                  type: integer
                  description: Security deposit amount in stroops
                duration_months:
                  type: integer
                  description: Lease duration in months
                start_date:
                  type: string
                  format: date
                  description: Lease start date
                end_date:
                  type: string
                  format: date
                  description: Lease end date
      responses:
        '201':
          description: Lease created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  lease_id:
                    type: string
                  transaction_hash:
                    type: string
        '400':
          description: Invalid request
        '500':
          description: Server error

    get:
      tags:
        - Leases
      summary: Get all leases
      description: Retrieve all leases from the blockchain
      parameters:
        - name: landlord_id
          in: query
          schema:
            type: string
          description: Filter by landlord ID
        - name: tenant_id
          in: query
          schema:
            type: string
          description: Filter by tenant ID
        - name: property_id
          in: query
          schema:
            type: string
          description: Filter by property ID
      responses:
        '200':
          description: List of leases
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  leases:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lease'

  /leases/{lease_id}:
    get:
      tags:
        - Leases
      summary: Get lease by ID
      description: Retrieve a specific lease by its ID
      parameters:
        - name: lease_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lease details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  lease:
                    $ref: '#/components/schemas/Lease'
        '404':
          description: Lease not found

  /leases/{lease_id}/pay:
    post:
      tags:
        - Leases
      summary: Pay rent for a lease
      description: Submit a rent payment for a specific lease
      parameters:
        - name: lease_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - amount
              properties:
                tenant_id:
                  type: string
                  description: Tenant's Stellar public key
                amount:
                  type: integer
                  description: Payment amount in stroops
      responses:
        '200':
          description: Payment successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  transaction_hash:
                    type: string

  /properties:
    get:
      tags:
        - Properties
      summary: Get all properties
      description: Retrieve all property listings
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: min_bedrooms
          in: query
          schema:
            type: integer
        - name: max_rent
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, active, inactive, rented]
      responses:
        '200':
          description: List of properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  properties:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'

    post:
      tags:
        - Properties
      summary: Create a new property
      description: Create a new property listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreate'
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  property:
                    $ref: '#/components/schemas/Property'

  /properties/{property_id}:
    get:
      tags:
        - Properties
      summary: Get property by ID
      description: Retrieve a specific property
      parameters:
        - name: property_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Property details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  property:
                    $ref: '#/components/schemas/Property'

    put:
      tags:
        - Properties
      summary: Update property
      description: Update an existing property
      parameters:
        - name: property_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyUpdate'
      responses:
        '200':
          description: Property updated

    delete:
      tags:
        - Properties
      summary: Delete property
      description: Delete a property listing
      parameters:
        - name: property_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Property deleted

  /users:
    post:
      tags:
        - Users
      summary: Create a new user
      description: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stellar_public_key
                - role
              properties:
                stellar_public_key:
                  type: string
                  description: Stellar public key
                email:
                  type: string
                  format: email
                phone:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                role:
                  type: string
                  enum: [landlord, tenant, admin]
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'

  /users/{user_id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve user details
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'

  /payments/initialize:
    post:
      tags:
        - Payments
      summary: Initialize payment
      description: Initialize a payment transaction via Paystack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - amount
                - reference
              properties:
                email:
                  type: string
                  format: email
                amount:
                  type: integer
                  description: Amount in kobo (NGN * 100)
                reference:
                  type: string
                  description: Unique transaction reference
                metadata:
                  type: object
                  description: Additional metadata
      responses:
        '200':
          description: Payment initialized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  authorization_url:
                    type: string
                  reference:
                    type: string

  /payments/verify/{reference}:
    get:
      tags:
        - Payments
      summary: Verify payment
      description: Verify a payment transaction
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                  amount:
                    type: integer
                  paid_at:
                    type: string
                    format: date-time

  /payments/banks:
    get:
      tags:
        - Payments
      summary: Get Nigerian banks
      description: Get list of Nigerian banks
      responses:
        '200':
          description: List of banks
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  banks:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        code:
                          type: string

  /payments/resolve-account:
    post:
      tags:
        - Payments
      summary: Resolve bank account
      description: Resolve bank account number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account_number
                - bank_code
              properties:
                account_number:
                  type: string
                bank_code:
                  type: string
      responses:
        '200':
          description: Account resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  account_name:
                    type: string

  /payments/subaccount:
    post:
      tags:
        - Payments
      summary: Create subaccount
      description: Create a Paystack subaccount for a landlord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - business_name
                - settlement_bank
                - account_number
                - percentage_charge
              properties:
                business_name:
                  type: string
                settlement_bank:
                  type: string
                account_number:
                  type: string
                percentage_charge:
                  type: number
      responses:
        '201':
          description: Subaccount created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  subaccount_code:
                    type: string

  /payments/transfer:
    post:
      tags:
        - Payments
      summary: Initiate transfer
      description: Initiate a transfer to a landlord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - recipient
                - reference
              properties:
                amount:
                  type: integer
                recipient:
                  type: string
                  description: Recipient code or account number
                reference:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Transfer initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  transfer_code:
                    type: string
                  status:
                    type: string

  /kyc/bvn:
    post:
      tags:
        - KYC
      summary: Verify BVN
      description: Verify Bank Verification Number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bvn
              properties:
                bvn:
                  type: string
                  description: 11-digit BVN
      responses:
        '200':
          description: BVN verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      first_name:
                        type: string
                      last_name:
                        type: string
                      bvn:
                        type: string

  /kyc/nin:
    post:
      tags:
        - KYC
      summary: Verify NIN
      description: Verify National Identity Number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nin
              properties:
                nin:
                  type: string
                  description: 11-digit NIN
      responses:
        '200':
          description: NIN verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                  data:
                    type: object

  /kyc/verify:
    post:
      tags:
        - KYC
      summary: Create KYC verification request
      description: Create a comprehensive KYC verification request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - dob
                - phone
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                dob:
                  type: string
                  format: date
                phone:
                  type: string
                bvn:
                  type: string
                nin:
                  type: string
      responses:
        '201':
          description: KYC request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  request_id:
                    type: string
                  status:
                    type: string

  /kyc/status/{requestId}:
    get:
      tags:
        - KYC
      summary: Get KYC status
      description: Check the status of a KYC verification request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: KYC status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                  data:
                    type: object

components:
  schemas:
    Lease:
      type: object
      properties:
        id:
          type: string
        property_id:
          type: string
        landlord_id:
          type: string
        tenant_id:
          type: string
        monthly_rent:
          type: integer
        security_deposit:
          type: integer
        duration_months:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum: [active, completed, terminated, disputed]
        platform_fee_collected:
          type: boolean

    Property:
      type: object
      properties:
        id:
          type: string
        landlord_id:
          type: string
        title:
          type: string
        description:
          type: string
        property_type:
          type: string
          enum: [apartment, house, flat, studio]
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        address:
          type: string
        city:
          type: string
        state:
          type: string
        monthly_rent_ngn:
          type: number
        security_deposit_ngn:
          type: number
        status:
          type: string
          enum: [pending, approved, rejected, active, inactive, rented]
        images:
          type: array
          items:
            type: string
        amenities:
          type: array
          items:
            type: string

    PropertyCreate:
      type: object
      required:
        - landlord_id
        - title
        - property_type
        - bedrooms
        - bathrooms
        - address
        - city
        - state
        - monthly_rent_ngn
      properties:
        landlord_id:
          type: string
        title:
          type: string
        description:
          type: string
        property_type:
          type: string
          enum: [apartment, house, flat, studio]
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        address:
          type: string
        city:
          type: string
        state:
          type: string
        monthly_rent_ngn:
          type: number
        security_deposit_ngn:
          type: number
        images:
          type: array
          items:
            type: string
        amenities:
          type: array
          items:
            type: string

    PropertyUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        monthly_rent_ngn:
          type: number
        status:
          type: string
          enum: [pending, approved, rejected, active, inactive, rented]

    User:
      type: object
      properties:
        id:
          type: string
        stellar_public_key:
          type: string
        email:
          type: string
        phone:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [landlord, tenant, admin]
        kyc_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
